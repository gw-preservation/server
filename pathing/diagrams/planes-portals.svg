<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="monospace" font-size="12">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#555"/>
    </marker>
    <marker id="portal-arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#e67e22"/>
    </marker>
  </defs>

  <text x="310" y="22" text-anchor="middle" font-size="15" font-weight="bold">Planes and Portals</text>

  <!-- Plane A background -->
  <rect x="30" y="40" width="560" height="170" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="2"/>
  <text x="50" y="62" font-size="14" font-weight="bold" fill="#2980b9">Plane A</text>

  <!-- Plane A trapezoids -->
  <polygon points="70,100 170,100 155,160 85,160" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
  <text x="120" y="135" text-anchor="middle" fill="#27ae60" font-weight="bold">T1</text>

  <polygon points="175,100 275,100 260,160 190,160" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
  <text x="225" y="135" text-anchor="middle" fill="#27ae60" font-weight="bold">T2</text>

  <polygon points="280,100 380,100 365,160 295,160" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
  <text x="330" y="135" text-anchor="middle" fill="#27ae60" font-weight="bold">T3</text>

  <polygon points="100,165 200,165 185,200 115,200" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="150" y="188" text-anchor="middle" fill="#27ae60" font-weight="bold">T4</text>

  <polygon points="300,165 400,165 385,200 315,200" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="350" y="188" text-anchor="middle" fill="#27ae60" font-weight="bold">T5</text>

  <!-- Intra-plane connections -->
  <line x1="170" y1="130" x2="175" y2="130" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="130" x2="280" y2="130" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="135" y1="160" x2="140" y2="165" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="160" x2="355" y2="165" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Portal pair in Plane A -->
  <rect x="430" y="110" width="110" height="40" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="485" y="135" text-anchor="middle" fill="white" font-weight="bold" font-size="11">Portal A</text>

  <!-- Plane B background -->
  <rect x="30" y="250" width="560" height="170" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="2"/>
  <text x="50" y="272" font-size="14" font-weight="bold" fill="#e67e22">Plane B</text>

  <!-- Plane B trapezoids -->
  <polygon points="100,310 200,310 185,370 115,370" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="150" y="345" text-anchor="middle" fill="#e74c3c" font-weight="bold">T6</text>

  <polygon points="205,310 305,310 290,370 220,370" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="255" y="345" text-anchor="middle" fill="#e74c3c" font-weight="bold">T7</text>

  <polygon points="100,375 200,375 185,410 115,410" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="150" y="398" text-anchor="middle" fill="#e74c3c" font-weight="bold">T8</text>

  <polygon points="210,375 310,375 295,410 225,410" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="260" y="398" text-anchor="middle" fill="#e74c3c" font-weight="bold">T9</text>

  <!-- Intra-plane connections -->
  <line x1="200" y1="340" x2="205" y2="340" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="370" x2="150" y2="375" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="255" y1="370" x2="260" y2="375" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Portal pair in Plane B -->
  <rect x="380" y="320" width="110" height="40" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="435" y="345" text-anchor="middle" fill="white" font-weight="bold" font-size="11">Portal B</text>

  <!-- Portal connection (bidirectional) -->
  <line x1="485" y1="150" x2="435" y2="320" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#portal-arr)"/>
  <line x1="435" y1="320" x2="485" y2="150" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#portal-arr)"/>

  <!-- Portal label -->
  <text x="495" y="235" fill="#e67e22" font-weight="bold" font-size="11">PairPlane</text>
  <text x="495" y="248" fill="#e67e22" font-weight="bold" font-size="11">PairPortal</text>
</svg>
