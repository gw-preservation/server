<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="monospace" font-size="12">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#555"/>
    </marker>
  </defs>

  <text x="350" y="20" text-anchor="middle" font-size="15" font-weight="bold">Data Pipeline</text>

  <!-- Stage 1: Gw.dat -->
  <rect x="20" y="50" width="130" height="60" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="85" y="75" text-anchor="middle" font-weight="bold" fill="#2980b9">Gw.dat</text>
  <text x="85" y="92" text-anchor="middle" fill="#555" font-size="10">Archive (MFT+TOC)</text>

  <!-- Arrow 1 -->
  <line x1="150" y1="80" x2="178" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="164" y="72" text-anchor="middle" fill="#888" font-size="9">GetFile</text>

  <!-- Stage 2: Decompress -->
  <rect x="180" y="50" width="130" height="60" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="245" y="75" text-anchor="middle" font-weight="bold" fill="#f39c12">Decompress</text>
  <text x="245" y="92" text-anchor="middle" fill="#555" font-size="10">Huffman + LZ77</text>

  <!-- Arrow 2 -->
  <line x1="310" y1="80" x2="338" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="324" y="72" text-anchor="middle" fill="#888" font-size="9">bytes</text>

  <!-- Stage 3: RIFF -->
  <rect x="340" y="50" width="130" height="60" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
  <text x="405" y="75" text-anchor="middle" font-weight="bold" fill="#8e44ad">RIFF Parse</text>
  <text x="405" y="92" text-anchor="middle" fill="#555" font-size="10">chunk 0x20000008</text>

  <!-- Arrow 3 -->
  <line x1="470" y1="80" x2="498" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="484" y="72" text-anchor="middle" fill="#888" font-size="9">import</text>

  <!-- Stage 4: PathData -->
  <rect x="500" y="50" width="130" height="60" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="565" y="75" text-anchor="middle" font-weight="bold" fill="#1abc9c">PathData</text>
  <text x="565" y="92" text-anchor="middle" fill="#555" font-size="10">Planes → Traps</text>

  <!-- Queries below -->
  <rect x="30" y="145" width="110" height="45" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="85" y="165" text-anchor="middle" font-weight="bold" fill="#27ae60" font-size="11">TrapezoidAt</text>
  <text x="85" y="180" text-anchor="middle" fill="#555" font-size="9">point lookup</text>

  <rect x="160" y="145" width="110" height="45" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="215" y="165" text-anchor="middle" font-weight="bold" fill="#27ae60" font-size="11">LineOfSight</text>
  <text x="215" y="180" text-anchor="middle" fill="#555" font-size="9">segment walk</text>

  <rect x="290" y="145" width="110" height="45" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="345" y="165" text-anchor="middle" font-weight="bold" fill="#27ae60" font-size="11">Reachable</text>
  <text x="345" y="180" text-anchor="middle" fill="#555" font-size="9">BFS connectivity</text>

  <rect x="420" y="145" width="110" height="45" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="475" y="165" text-anchor="middle" font-weight="bold" fill="#27ae60" font-size="11">FindPath</text>
  <text x="475" y="180" text-anchor="middle" fill="#555" font-size="9">A* + funnel</text>

  <rect x="550" y="145" width="110" height="45" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="165" text-anchor="middle" font-weight="bold" fill="#27ae60" font-size="11">Store</text>
  <text x="605" y="180" text-anchor="middle" fill="#555" font-size="9">cached loading</text>

  <!-- Arrows from PathData to queries -->
  <line x1="565" y1="110" x2="85" y2="145" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="565" y1="110" x2="215" y2="145" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="565" y1="110" x2="345" y2="145" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="565" y1="110" x2="475" y2="145" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="565" y1="110" x2="605" y2="145" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
</svg>
